<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин ЧСВ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            padding-bottom: 90px;
        }
        h1 { text-align: center; font-size: 22px; margin-bottom: 4px; color: #ffb700; }
        .subtitle { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 16px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2c);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; background: #333; }
        .card h3 { font-size: 13px; margin: 6px 0 2px; }
        .card p { font-size: 12px; color: #ffcc00; margin: 0 0 8px; font-weight: bold; }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 11px;
            cursor: pointer;
            width: 100%;
        }
        .btn:active { opacity: 0.8; }
        .cart-container {
            margin-top: 24px;
            background: var(--tg-theme-secondary-bg-color, #2c2c2c);
            border-radius: 12px;
            padding: 12px;
        }
        .cart-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #ffb700; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 6px;
            border-bottom: 1px solid #3d3d3d;
            padding-bottom: 4px;
        }
        .cart-item button {
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 10px;
        }
        .cart-total {
            margin-top: 10px;
            font-size: 15px;
            font-weight: bold;
            text-align: right;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <h1>clan ЧСВ</h1>
    <div class="subtitle">Официальный магазин клана</div>
    
    <div class="grid" id="product-list">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1595590424283-b8f17842773f?w=300" alt="Item">
            <h3>Пак СМГ</h3>
            <p>15 руб.</p>
            <button class="btn" onclick="addToCart('Пак СМГ', 15)">В корзину</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=300" alt="Item">
            <h3>Пак патронов</h3>
            <p>50 руб.</p>
            <button class="btn" onclick="addToCart('Пак патронов', 50)">В корзину</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300" alt="Item">
            <h3>Пак металла (10k)</h3>
            <p>100 руб.</p>
            <button class="btn" onclick="addToCart('Пак металла (10k)', 100)">В корзину</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300" alt="Item">
            <h3>Топовый кит (оружие)</h3>
            <p>350 руб.</p>
            <button class="btn" onclick="addToCart('Топовый кит (оружие)', 350)">В корзину</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300" alt="Item">
            <h3>Рейд-набор</h3>
            <p>500 руб.</p>
            <button class="btn" onclick="addToCart('Рейд-набор', 500)">В корзину</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1612287233002-91d0f5326c2a?w=300" alt="Item">
            <h3>Привилегия / Роль</h3>
            <p>1000 руб.</p>
            <button class="btn" onclick="addToCart('Привилегия / Роль', 1000)">В корзину</button>
        </div>
    </div>

    <div class="cart-container">
        <div class="cart-title">🛒 Ваша корзина</div>
        <div id="cart-items">
            <div style="color: #888; font-size: 13px;">Корзина пуста</div>
        </div>
        <div class="cart-total" id="cart-total">Итого: 0 руб.</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let cart = [];

        function addToCart(title, price) {
            cart.push({ title, price });
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotalContainer = document.getElementById('cart-total');
            
            cartItemsContainer.innerHTML = '';

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<div style="color: #888; font-size: 13px;">Корзина пуста</div>';
                cartTotalContainer.innerHTML = 'Итого: 0 руб.';
                tg.MainButton.hide();
                return;
            }

            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <span>${item.title} — ${item.price} руб.</span>
                    <button onclick="removeFromCart(${index})">Удалить</button>
                `;
                cartItemsContainer.appendChild(itemDiv);
            });

            cartTotalContainer.innerHTML = `Итого: ${total} руб.`;

            tg.MainButton.setText(`Оформить заказ (${total} руб.)`);
            tg.MainButton.show();
        }

        Telegram.WebApp.onEvent('mainButtonClicked', function(){
            tg.sendData(JSON.stringify(cart));
        });
    </script>
</body>
</html>
